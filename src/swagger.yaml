          example: "Thriller Psicológico"
        diretorId:
          type: string
          description: ID do diretor associado ao filme.
          example: "dir-finch"
        categoriaId:
          type: string
          description: ID da categoria principal (gênero) associada.
          example: "cat-thriller"
        formatoId:
          type: string
          description: ID do formato de mídia associado (e.g., a cópia digital ou Blu-Ray).
          example: "fmt-4k"
      required: [id, titulo, ano, genero]

    FilmeCreate:
      type: object
