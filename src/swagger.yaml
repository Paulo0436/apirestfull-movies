    EstoqueCreate:
      type: object
      description: Payload para criação ou atualização de item de estoque.
      properties:
        quantidade:
          type: integer
          format: int32
          description: Número de unidades disponíveis em estoque.
          example: 10
        filmeId:
          type: string
          description: ID do filme ao qual este estoque se refere.
          example: "movie-matrix"
      required: [quantidade, filmeId]

    Filme:
      type: object
      description: Modelo de dados para um filme no catálogo.
      properties:
        id:
          type: string
          description: ID único do filme.
          example: "movie-fightc"
        titulo:
          type: string
          description: Título original ou traduzido do filme.
          example: "Clube da Luta"
        ano:
          type: integer
          format: int32
          description: Ano de lançamento do filme.
          example: 1999
        genero:
