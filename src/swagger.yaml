        nacionalidade:
          type: string
          description: País de origem do diretor.
          example: "EUA"
      required: [nome]

    Estoque:
      type: object
      description: Modelo de dados para controle de estoque de um filme específico.
      properties:
        id:
          type: string
          description: ID único do item de estoque.
          example: "stock-500"
        quantidade:
          type: integer
          format: int32
          description: Número de unidades disponíveis em estoque.
          example: 50
        filmeId:
          type: string
          description: ID do filme ao qual este estoque se refere.
          example: "movie-incept"
