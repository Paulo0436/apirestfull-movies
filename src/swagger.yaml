openapi: 3.0.0
info:
  title: API de Filmes
  description: Uma API completa para gerenciamento de um catálogo e estoque de filmes, incluindo autenticação de usuários.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de Desenvolvimento Local

tags:
  - name: Autenticação & Usuários
    description: Endpoints de registro, login e gerenciamento de perfis de usuários.
  - name: Categorias
    description: Gerenciamento de gêneros e tipos de filmes (e.g., Ação, Drama).
  - name: Formatos
    description: Tipos de mídia de exibição (e.g., DVD, Blu-Ray, Digital).
  - name: Diretores
    description: Cadastro e consulta de diretores de filmes.
  - name: Filmes
    description: CRUD para os filmes no catálogo principal.
  - name: Estoque
    description: Controle de estoque de unidades de filmes.

paths:
  /usuario/register:
    post:
      tags: [Autenticação & Usuários]
      summary: Registrar novo usuário
      description: Cria uma nova conta de usuário no sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRegister"
      responses:
        201:
          description: Usuário registrado com sucesso. Retorna o token de acesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        400:
          $ref: "#/components/responses/BadRequest"

  /usuario/login:
    post:
      tags: [Autenticação & Usuários]
      summary: Login do usuário
      description: Autentica o usuário e retorna um token JWT para acesso seguro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioLogin"
      responses:
        200:
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"

  /usuario:
    get:
      tags: [Autenticação & Usuários]
      summary: Listar todos os usuários
      description: Requer autenticação. Geralmente acesso restrito a administradores.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de usuários retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"

  /usuario/{id}:
    get:
      tags: [Autenticação & Usuários]
      summary: Buscar usuário por ID
      description: Requer autenticação. Permite buscar detalhes de um usuário específico.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: O ID único do usuário.
      responses:
        200:
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Autenticação & Usuários]
      summary: Atualizar usuário por ID
      description: Requer autenticação. Atualiza informações de perfil do usuário.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: O ID único do usuário a ser atualizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        200:
          description: Usuário atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        403:
          $ref: "#/components/responses/Forbidden"

    delete:
      tags: [Autenticação & Usuários]
      summary: Excluir usuário por ID
      description: Requer autenticação. Exclui permanentemente um usuário.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: O ID único do usuário a ser excluído.
      responses:
        204:
          description: Usuário excluído com sucesso (No Content).
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        403:
          $ref: "#/components/responses/Forbidden"

  /movie/categoria:
    get:
      tags: [Categorias]
      summary: Listar todas as categorias
      responses:
        200:
          description: Lista de categorias retornada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
    post:
      tags: [Categorias]
      summary: Criar nova categoria
      description: Requer autenticação. Adiciona uma nova categoria de filme (e.g., 'Ficção Científica').
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaCreate"
      responses:
        201:
          description: Categoria criada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        400:
          $ref: "#/components/responses/BadRequest"

  /movie/categoria/{id}:
    get:
      tags: [Categorias]
      summary: Buscar categoria por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Categoria encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Categorias]
      summary: Atualizar categoria
      description: Requer autenticação. Atualiza o nome de uma categoria.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaCreate"
      responses:
        200:
          description: Categoria atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        400:
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Categorias]
      summary: Excluir categoria
      description: Requer autenticação. Exclui uma categoria.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        204:
          description: Categoria excluída com sucesso (No Content).
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /movie/formato:
    get:
      tags: [Formatos]
      summary: Listar todos os formatos
      responses:
        200:
          description: Lista de formatos de mídia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Formato"
    post:
      tags: [Formatos]
      summary: Criar novo formato
      description: Requer autenticação. Adiciona um novo formato de mídia (e.g., 'VHS', 'Digital 4K').
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormatoCreate"
      responses:
        201:
          description: Formato criado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Formato"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        400:
          $ref: "#/components/responses/BadRequest"

  /movie/formato/{id}:
    get:
      tags: [Formatos]
      summary: Buscar formato por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Formato encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Formato"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Formatos]
      summary: Atualizar formato
      description: Requer autenticação. Atualiza o nome de um formato.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormatoCreate"
      responses:
        200:
          description: Formato atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Formato"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        400:
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Formatos]
      summary: Excluir formato
      description: Requer autenticação. Exclui um formato.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        204:
          description: Formato excluído com sucesso (No Content).
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /movie/diretor:
    get:
      tags: [Diretores]
      summary: Listar todos os diretores
      responses:
        200:
          description: Lista de diretores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Diretor"
    post:
      tags: [Diretores]
      summary: Criar novo diretor
      description: Requer autenticação. Adiciona um novo diretor ao catálogo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiretorCreate"
      responses:
        201:
          description: Diretor criado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diretor"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        400:
          $ref: "#/components/responses/BadRequest"

  /movie/diretor/{id}:
    get:
      tags: [Diretores]
      summary: Buscar diretor por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Diretor encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diretor"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diretores]
      summary: Atualizar diretor
      description: Requer autenticação. Atualiza as informações de um diretor.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiretorCreate"
      responses:
        200:
          description: Diretor atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diretor"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        400:
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Diretores]
      summary: Excluir diretor
      description: Requer autenticação. Exclui um diretor.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        204:
          description: Diretor excluído com sucesso (No Content).
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /movie/estoque:
    get:
      tags: [Estoque]
      summary: Listar todos os itens de estoque
      description: Requer autenticação. Lista o estoque atual de todos os filmes.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de estoque retornada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Estoque"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Estoque]
      summary: Criar item de estoque
      description: Requer autenticação. Cria ou adiciona um novo registro de estoque para um filme.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstoqueCreate"
      responses:
        201:
          description: Item de estoque criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estoque"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        400:
          $ref: "#/components/responses/BadRequest"

  /movie/estoque/{id}:
    get:
      tags: [Estoque]
      summary: Buscar item de estoque por ID
      description: Requer autenticação. Busca detalhes de um registro de estoque.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Item de estoque encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estoque"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Estoque]
      summary: Atualizar item de estoque (Ajustar quantidade)
      description: Requer autenticação. Atualiza a quantidade ou o filme associado ao registro de estoque.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstoqueCreate"
      responses:
        200:
          description: Estoque atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estoque"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        400:
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Estoque]
      summary: Excluir item de estoque
      description: Requer autenticação. Remove um registro de estoque.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        204:
          description: Item de estoque removido com sucesso (No Content).
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /movie/filme:
    get:
      tags: [Filmes]
      summary: Listar filmes
      description: Retorna uma lista de todos os filmes no catálogo.
      responses:
        200:
          description: Lista de filmes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Filme"
    post:
      tags: [Filmes]
      summary: Criar novo filme
      description: Requer autenticação. Adiciona um novo filme ao catálogo, referenciando entidades como diretor, categoria e formato.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmeCreate"
      responses:
        201:
          description: Filme criado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filme"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        400:
          $ref: "#/components/responses/BadRequest"

  /movie/filme/{id}:
    get:
      tags: [Filmes]
      summary: Buscar filme por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Filme encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filme"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Filmes]
      summary: Atualizar filme
      description: Requer autenticação. Atualiza os detalhes de um filme existente.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmeCreate"
      responses:
        200:
          description: Filme atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filme"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        400:
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Filmes]
      summary: Excluir filme
      description: Requer autenticação. Exclui um filme do catálogo.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        204:
          description: Filme excluído com sucesso (No Content).
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Insira o token JWT retornado no login.

  responses:
    Unauthorized:
      description: Não Autorizado. Token JWT não fornecido ou inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            codigo: 401
            mensagem: Acesso não autorizado. Token ausente ou inválido.
    Forbidden:
      description: Proibido. Você não tem permissão para realizar esta ação (e.g., não é admin).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            codigo: 403
            mensagem: Acesso proibido. Permissão insuficiente.
    NotFound:
      description: Não Encontrado. O recurso solicitado não existe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            codigo: 404
            mensagem: Usuário não encontrado com o ID especificado.
    BadRequest:
      description: Requisição Inválida. Erro de validação ou dados incorretos no corpo da requisição.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            codigo: 400
            mensagem: Campos obrigatórios ausentes ou em formato inválido.

  schemas:
    
    Erro:
      type: object
      description: Estrutura padrão para retorno de erros na API.
      properties:
        codigo:
          type: integer
          format: int32
          description: Código HTTP do erro.
        mensagem:
          type: string
          description: Descrição detalhada do erro.

    AuthResponse:
      type: object
      description: Resposta após um login ou registro bem-sucedido.
      properties:
        token:
          type: string
          description: O token JWT a ser usado para autenticação (Bearer Token).
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIwMDEyMywiaWF0IjoxNjM4NDU0ODAwfQ.ABCDEFGHIJKLMN"
        usuario:
          $ref: "#/components/schemas/Usuario"
      required: [token, usuario]

    Usuario:
      type: object
      description: Modelo de dados completo de um usuário retornado pela API.
      properties:
        id:
          type: string
          description: ID único do usuário.
          example: "user-12345"
        nome:
          type: string
          description: Nome completo do usuário.
          example: "Maria da Silva"
        email:
          type: string
          format: email
          description: Endereço de e-mail único do usuário.
          example: "maria.silva@exemplo.com"
      required: [id, nome, email]

    UsuarioRegister:
      type: object
      description: Payload para o registro de um novo usuário.
      properties:
        nome:
          type: string
          example: "João Pereira"
        email:
          type: string
          format: email
          example: "joao.pereira@exemplo.com"
        senha:
          type: string
          format: password
          description: Senha do usuário (mínimo 8 caracteres).
          example: "senhaSegura123"
      required: [nome, email, senha]

    UsuarioLogin:
      type: object
      description: Payload para o login de usuário.
      properties:
        email:
          type: string
          format: email
          example: "maria.silva@exemplo.com"
        senha:
          type: string
          format: password
          example: "senhaSecreta123"
      required: [email, senha]

    UsuarioUpdate:
      type: object
      description: Campos opcionais para atualização de um usuário existente.
      properties:
        nome:
          type: string
          example: "Maria da Silva Júnior"
        email:
          type: string
          format: email
          example: "mariasilvajr@exemplo.com"

    Categoria:
      type: object
      description: Modelo de dados para categorias (gêneros) de filmes.
      properties:
        id:
          type: string
          description: ID único da categoria.
          example: "cat-act"
        nome:
          type: string
          description: Nome da categoria.
          example: "Ação"
      required: [id, nome]
      
    CategoriaCreate:
      type: object
      description: Payload para criação ou atualização de categoria.
      properties:
        nome:
          type: string
          description: Nome da categoria.
          example: "Terror"
      required: [nome]

    Formato:
      type: object
      description: Modelo de dados para formatos de mídia de filmes.
      properties:
        id:
          type: string
          description: ID único do formato.
          example: "fmt-blu"
        nome:
          type: string
          description: Nome do formato (e.g., 'DVD', '4K').
          example: "Blu-Ray"
      required: [id, nome]
      
    FormatoCreate:
      type: object
      description: Payload para criação ou atualização de formato.
      properties:
        nome:
          type: string
          description: Nome do formato.
          example: "VHS"
      required: [nome]

    Diretor:
      type: object
